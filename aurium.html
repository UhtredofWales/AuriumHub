<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AuriumHub</title>
<style>
:root{--bg:#f3f6f5;--pn:#fff;--tx:#1b2420;--mu:#6b7873;--bd:#e1e7e4;--ac:#0f8a6f;--acs:#e0f3ee;--out:#d9f5dc;--wa:#ece6dd;--dn:#d64545;--in:#fff;color-scheme:light;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0;height:100vh;display:flex}
.app{display:flex;width:100%;height:100%}
nav{width:210px;background:var(--pn);border-right:1px solid var(--bd);padding:14px 10px;display:flex;flex-direction:column;gap:4px}
nav h1{font-size:17px;margin:0 6px 10px;color:var(--ac)}
nav button{all:unset;cursor:pointer;padding:9px 10px;border-radius:8px;display:flex;gap:8px;align-items:center;font-weight:600;color:var(--ac);background:var(--acs)}
main{flex:1;padding:16px;overflow:auto}
.ib{display:grid;grid-template-columns:270px 1fr 230px;gap:12px;height:calc(100vh - 34px)}
.col{background:var(--pn);border:1px solid var(--bd);border-radius:12px;overflow:auto;display:flex;flex-direction:column}
.it{padding:10px 12px;border-bottom:1px solid var(--bd);cursor:pointer;background:var(--acs)}
.chat{background:var(--wa);padding:12px;flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px}
.bb{max-width:75%;padding:7px 10px;border-radius:10px;background:var(--in);align-self:flex-start;white-space:pre-wrap}
.bb.a{background:var(--out);align-self:flex-end}
.bb small{display:block;text-align:right;color:var(--mu);font-size:10px}
.cmp{display:flex;gap:6px;padding:8px;border-top:1px solid var(--bd)}
.cmp input{flex:1;padding:7px 9px;border:1px solid var(--bd);border-radius:8px;background:var(--pn);color:var(--tx)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 13px;cursor:pointer;font-weight:600}
.hd{padding:10px 12px;border-bottom:1px solid var(--bd);font-weight:bold}
.mu{color:var(--mu);font-size:12px}
</style></head>
<body>
<div class="app" id="app">
  <nav>
    <h1>AuriumHub <span class="mu" style="color:var(--ac)">PRO</span></h1>
    <button>💬 Conversas Reais</button>
  </nav>
  <main>
    <div class="ib">
      <div class="col">
        <div class="hd">Fila de Atendimento</div>
        <div class="it">
          <b>Cliente Teste</b>
          <span class="mu">+55 11 99999-9999</span>
        </div>
      </div>
      <div class="col">
        <div class="hd">Cliente Teste</div>
        <div class="chat" id="chat-box">
          <div class="bb">Envie uma mensagem abaixo para testar a API real da Meta.<small>Sistema</small></div>
        </div>
        <div class="cmp">
          <input id="msg" placeholder="Digite sua mensagem..." onkeydown="if(event.key=='Enter')sendRealMsg()">
          <button class="btn" onclick="sendRealMsg()">Enviar</button>
        </div>
      </div>
      <div class="col" style="padding:12px">
        <b>Configurar Destinatário</b><br><br>
        <label class="mu">Telefone (com DDI e DDD):</label><br>
        <input id="dest-phone" value="+5511999999999" style="width:100%;margin-top:6px;padding:6px;border:1px solid var(--bd);border-radius:6px">
      </div>
    </div>
  </main>
</div>
<script>
const hm=()=>new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

async function sendRealMsg() {
    const inputMsg = document.getElementById('msg');
    const phoneInput = document.getElementById('dest-phone');
    const chatBox = document.getElementById('chat-box');

    const text = inputMsg.value.trim();
    const phone = phoneInput.value.trim();

    if(!text) return;
    if(!phone) {
        alert('Por favor, informe o telefone do destinatário.');
        return;
    }

    chatBox.innerHTML += `<div class="bb a">${text}<small>${hm()}</small></div>`;
    chatBox.scrollTop = chatBox.scrollHeight;
    inputMsg.value = '';

    try {
        const response = await fetch('/api/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ to: phone, message: text })
        });

        const result = await response.json();

        if (!result.success) {
            alert('Erro retornado pela Meta: ' + (result.error?.message || JSON.stringify(result.error)));
        } else {
            console.log('Mensagem enviada com sucesso!', result.data);
        }
    } catch (err) {
        console.error('Erro de conexão:', err);
        alert('Erro ao conectar ao servidor backend.');
    }
}
</script>
</body>
</html>
